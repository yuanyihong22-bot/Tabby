[project]
name = "excel-pin"
version = "0.1.0"
description = "一键把 Excel 工作簿窗口临时置顶的 Windows 托盘小工具"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pywin32>=306",
]

[project.scripts]
excel-pin = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
